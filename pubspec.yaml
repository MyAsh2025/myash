name: myash
description: MyAsh Hive project with verify & sync
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Data & local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # For UUIDs (if needed)
  uuid: ^4.5.1

  # State & utils
  provider: ^6.1.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11


flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: fonts/NotoSansJP-Regular.ttf
        - asset: fonts/NotoSansJP-Bold.ttf
          weight: 700
